<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Capstone Agent Portal</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }

      main {
        text-align: center;
        max-width: 640px;
        padding: 2rem;
      }

      a {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.75rem 1.25rem;
        border-radius: 0.5rem;
        text-decoration: none;
        background: #2563eb;
        color: #ffffff;
        font-weight: 600;
      }

      a:hover,
      a:focus-visible {
        background: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>AI Capstone Agent Portal</h1>
      <p>
        This site is a landing page for the AI Capstone Agent application hosted
        externally.
      </p>
      <p>Update the link below with your deployed application URL.</p>
      <a href="https://example.com" rel="noopener noreferrer">Open the application</a>
    </main>
  </body>
</html>
